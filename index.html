<title>Latian Ning Gym</title>
<meta name="theme-color" content="#FC5200">
<meta name="description" content="Program gym 3 bulan: latihan, makan, progres berat badan, dan pengingat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --bg:#F4F5FA;--surface:#FFFFFF;--surface2:#EEF0F6;--ink:#141726;--muted:#5D6478;--line:#DFE2EC;
 --a:#E8552A;--a-soft:#FFE6DC;--a-ink:#8A2A0C;--b:#6A5AE0;--b-soft:#E8E5FF;--b-ink:#3A2E9E;
 --c:#0F9488;--c-soft:#D5F4EF;--c-ink:#075E56;--gold:#F5B700;--gold-ink:#3A2B00;--danger:#C0352B;
 --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1017;--surface:#171A24;--surface2:#212533;--ink:#EEF0F7;--muted:#A0A7BA;--line:#2B3040;
 --a-soft:#3B1E14;--a-ink:#FFB59C;--b-soft:#262150;--b-ink:#C9C1FF;--c-soft:#0E302C;--c-ink:#7FE3D5;--danger:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1017;--surface:#171A24;--surface2:#212533;--ink:#EEF0F7;--muted:#A0A7BA;--line:#2B3040;
 --a-soft:#3B1E14;--a-ink:#FFB59C;--b-soft:#262150;--b-ink:#C9C1FF;--c-soft:#0E302C;--c-ink:#7FE3D5;--danger:#FF8A80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 190px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.top h1{font:800 30px/1 var(--display);margin:0;letter-spacing:.3px}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font:700 18px var(--display)}
.streak i{width:26px;height:26px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;margin-bottom:14px;min-height:170px}
.hero.A{background:var(--a)}.hero.B{background:var(--b)}.hero.F{background:var(--c)}
.hero .art{position:absolute;right:-18px;bottom:-14px;width:190px;height:190px;opacity:.95}
.hero small{font-weight:600;font-size:14px;opacity:.9}
.hero h2{font:800 46px/1 var(--display);margin:4px 0 6px;position:relative}
.hero p{margin:0;max-width:60%;font-size:15px;position:relative;opacity:.95}
.swap{position:relative;margin-top:14px;display:inline-flex;background:rgba(255,255,255,.18);border-radius:12px;padding:3px}
.swap button{border:0;background:transparent;color:#fff;font:700 18px var(--display);padding:6px 16px;border-radius:9px;cursor:pointer}
.swap button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:center;padding:7px 0 8px;font-size:12px;color:var(--muted)}
.day b{display:grid;place-items:center;width:28px;height:28px;margin:3px auto 0;border-radius:50%;font:700 16px var(--display);color:var(--ink);background:var(--surface2)}
.day.today{border-color:var(--ink)}
.day.A b{background:var(--a);color:#fff}.day.B b{background:var(--b);color:#fff}.day.F b{background:var(--c);color:#fff}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.exh{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.t-legs{background:var(--a-soft);color:var(--a-ink)}.t-chest{background:var(--b-soft);color:var(--b-ink)}.t-back{background:var(--c-soft);color:var(--c-ink)}
.t-shoulder{background:#FFF1C7;color:#6B4E00}.t-arms{background:#FCE1EE;color:#8E1F57}.t-core{background:#DCEBFF;color:#1C4E9A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-shoulder{background:#3A2F0A;color:#FFD966}:root:not([data-theme="light"]) .t-arms{background:#3D1427;color:#FFA3CC}:root:not([data-theme="light"]) .t-core{background:#132A4A;color:#9CC3FF}}
.ex h3{font:700 23px/1.1 var(--display);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;color:var(--muted);margin:3px 0 0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.tip{font-size:14px;color:var(--muted);margin:10px 0 2px}
.hint{font-size:14px;color:var(--b-ink);background:var(--b-soft);border-radius:10px;padding:8px 10px;margin:10px 0 0;font-weight:600}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center;margin-top:8px;position:relative}
.set .n{font:700 19px var(--display);color:var(--muted);text-align:center}
.field{position:relative;display:block}
.field input{width:100%;font:700 24px var(--display);color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:8px 38px 8px 12px;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.bw{font-size:14px;color:var(--muted);padding-left:4px}
.chk{height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.chk svg{width:22px;height:22px}
.chk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.set.done .field input{background:transparent;border-color:var(--line)}
.pr{position:absolute;right:58px;top:-7px;background:var(--gold);color:var(--gold-ink);font:800 12px var(--display);padding:1px 7px;border-radius:999px;letter-spacing:.5px}
.act{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:8px 16px;z-index:15;pointer-events:none}
.act .in{max-width:560px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
.timer{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13px;font-weight:600}
.timer b{font:800 28px var(--display);min-width:58px}
.timer .ring{width:34px;height:34px}
.timer.run{border-color:var(--gold)}
.primary{border:0;background:var(--ink);color:var(--bg);font:700 16px var(--body);padding:0 20px;border-radius:16px;cursor:pointer;min-height:56px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:10px 14px;border-radius:12px;cursor:pointer}
.danger{color:var(--danger)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;border-radius:12px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:800 32px/1.05 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font:700 22px var(--display);margin:0 0 8px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--b);min-height:4px}
.chart div:last-child i{background:var(--a)}
.prs{list-style:none;margin:0;padding:0}
.prs li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.prs li:first-child{border-top:0}
.prs b{font:700 19px var(--display)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{text-align:center;font-size:13px;color:var(--muted);padding:6px 2px}
.badge .medal{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.badge .medal svg{width:28px;height:28px}
.badge.on{color:var(--ink);font-weight:600}
.badge.on .medal{background:var(--gold);color:var(--gold-ink)}
.hist{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.hist .ico{color:#fff}.hist .ico.A{background:var(--a)}.hist .ico.B{background:var(--b)}
.hist h3{font:700 20px var(--display);margin:0}
.hist .sp{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.res{border-radius:24px;overflow:hidden;margin-bottom:14px;color:#fff}
.res.A{background:var(--a)}.res.B{background:var(--b)}
.res .head{padding:20px 20px 10px;position:relative;overflow:hidden;min-height:150px}
.res .art{position:absolute;right:-24px;top:-20px;width:180px;height:180px}
.res .head>small,.res .head>h2{position:relative}
.res .head h2{font:800 44px/1 var(--display);margin:6px 0 2px}
.res .head small{font-weight:600;opacity:.9}
.res .big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.25);margin-top:10px}
.res .big div{background:inherit;padding:12px 20px}
.res.A .big div{background:var(--a)}.res.B .big div{background:var(--b)}
.res .big b{display:block;font:800 36px/1 var(--display)}
.res .big span{font-size:13px;opacity:.9}
.res .musc{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px 18px}
.res .musc span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.row{display:flex;gap:10px;margin-bottom:14px}
.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;width:22px;height:22px;border-radius:6px;color:#fff;text-align:center;font:700 15px/22px var(--display);margin-right:6px}
.tag.A{background:var(--a)}.tag.B{background:var(--b)}
.habit{display:grid;grid-template-columns:42px minmax(0,1fr) 50px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.habit .ico{width:42px;height:42px;border-radius:12px;background:var(--c-soft);color:var(--c-ink)}
.habit .ico svg{width:22px;height:22px}
.habit b{display:block;font-weight:600}
.habit span{font-size:14px;color:var(--muted)}
.ring-wrap{position:relative;width:120px;height:120px;flex:none}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font:800 34px var(--display);color:#fff}
.steps{margin:4px 0 0;padding-left:20px}
.steps li{margin-bottom:8px}
.steps li span{color:var(--muted);font-size:14px;display:block}
.rem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.rem svg{width:26px;height:26px;flex:none;color:var(--gold)}
.rem.ok{border-color:var(--line)}.rem.ok svg{color:var(--c)}
.rem b{display:block}.rem span{font-size:14px;color:var(--muted)}
.pbar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden;max-width:62%}
.pbar i{display:block;height:100%;background:#fff;border-radius:99px}
.pbar.dark{background:var(--surface2);max-width:none}.pbar.dark i{background:var(--a)}
.pbig{display:flex;align-items:baseline;gap:8px;margin-top:6px}.pbig b{font:800 44px/1 var(--display)}.pbig span{color:var(--muted)}
.startp{position:relative;margin-top:12px;border:0;background:#fff;color:var(--ink);font:700 15px var(--body);padding:10px 14px;border-radius:12px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:700 15px var(--body);padding:10px 0;border-radius:10px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tinput{font:700 20px var(--display);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.res{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.res{animation:none}.toast{transition:none}}
.hero .swap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.hero .swap button{padding:8px 0;font:700 14px var(--body)}
.coach{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.coach .ico{width:40px;height:40px;border-radius:12px;background:var(--b-soft);color:var(--b-ink)}.coach .ico svg{width:22px;height:22px}
.coach b{display:block}.coach span{font-size:14px;color:var(--muted)}
.glasses{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.glasses button{border:0;background:var(--surface2);color:var(--muted);border-radius:10px;padding:8px 0;cursor:pointer;display:grid;place-items:center}
.glasses button svg{width:20px;height:20px}
.glasses button[aria-pressed="true"]{background:var(--c);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:600 14px var(--body);padding:8px 0;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meals{list-style:none;margin:0;padding:0}
.meals li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meals li:first-child{border-top:0}
.meals b{display:block}.meals span{font-size:14px;color:var(--muted)}
.meals em{font-style:normal;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.wrow{display:flex;gap:8px;margin-top:10px}.wrow>*{flex:1;min-width:0}.wrow .primary{flex:none;min-height:48px}
.ico.A{background:var(--a);color:#fff}.ico.B{background:var(--b);color:#fff}

/* ===== Tampilan segar ala aplikasi olahraga ===== */
:root{--bg:#F5F5F7;--surface:#FFFFFF;--surface2:#F0F0F3;--ink:#242428;--muted:#6D6D78;--line:#E6E6EB;
 --a:#FC5200;--a-soft:#FFEDE4;--a-ink:#B33A00;--b:#2D3142;--b-soft:#E9EAF0;--b-ink:#2D3142;--c:#FC5200;--c-soft:#FFEDE4;--c-ink:#B33A00;
 --display:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1C1C1F;--surface2:#27272C;--ink:#F2F2F5;--muted:#A1A1AA;--line:#2E2E34;--a-soft:#3A1D10;--a-ink:#FF9C6E;--b:#C7CAD6;--b-soft:#2A2C36;--b-ink:#D5D8E3;--c-soft:#3A1D10;--c-ink:#FF9C6E}}
:root[data-theme="dark"]{--bg:#121214;--surface:#1C1C1F;--surface2:#27272C;--ink:#F2F2F5;--muted:#A1A1AA;--line:#2E2E34;--a-soft:#3A1D10;--a-ink:#FF9C6E;--b:#C7CAD6;--b-soft:#2A2C36;--b-ink:#D5D8E3;--c-soft:#3A1D10;--c-ink:#FF9C6E}
body{font-size:15px}
.wrap{padding-top:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--surface);margin:0 -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{font:800 22px/1.1 var(--display);color:var(--a);letter-spacing:-.2px}
.top p{font-size:13px}
.streak{font:700 16px var(--body);background:var(--surface2);border:0}
.streak i{background:var(--a);color:#fff}
.hero,.hero.A,.hero.B,.hero.F{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;min-height:0}
.hero .art{color:var(--a);width:150px;height:150px;right:-20px;bottom:-20px}
.hero small{color:var(--a);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;opacity:1}
.hero h2{font:800 32px/1.1 var(--display);letter-spacing:-.4px}
.hero p{color:var(--muted);opacity:1;font-size:14px}
.hero .swap{background:var(--surface2)}
.hero .swap button{color:var(--muted)}
.hero .swap button[aria-pressed="true"]{background:var(--a);color:#fff}
.pbar{background:var(--surface2)}.pbar i{background:var(--a)}
.startp{background:var(--a);color:#fff}
.ex,.card,.stat,.coach,.rem,.day,.feed{border-radius:12px}
.ex h3,.card h3{font:800 18px/1.25 var(--display);letter-spacing:-.2px}
.set .n{font:700 16px var(--body)}
.field input{font:700 20px var(--body);border-radius:10px}
.chk{border-radius:10px}
.chk[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
.pr{font:800 11px var(--body)}
.hint{background:var(--a-soft);color:var(--a-ink)}
.chip{font-weight:600}
.t-legs,.t-chest,.t-back,.t-shoulder,.t-arms,.t-core{background:var(--a-soft);color:var(--a-ink)}
.day b{font:700 14px var(--body)}
.day.A b{background:var(--a)}.day.B b{background:var(--b);color:var(--surface)}
.stat{display:flex;flex-direction:column-reverse;gap:2px}

 if(!m.prof.set&&inc.prof.set)m.prof=inc.prof;

// Metrik utama per sesi: beban terberat (kg), beban bantuan terkecil (pull-up), atau durasi terlama (plank).

function exMetric(e,a){

 const bad=d.sessions.length-inc.sessions.length;

  [{l:"Gabungkan dengan data sekarang",v:"merge",cls:"primary"},{l:"Ganti semua data sekarang",v:"replace",cls:"ghost danger"},{l:"Batal",v:null}]);
 if(!mode)return;
 if(mode==="replace"&&!(await yes("Ganti semua data?","Semua catatan di perangkat ini akan diganti dengan isi file. Tindakan ini tidak bisa dibatalkan. Ekspor data dulu jika ragu.","Ya, ganti semua")))return;
 if(mode==="merge"){S=merge(S,inc)}else{S=inc;S.draft=null}
