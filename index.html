<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latian Ning Gym</title>
<meta name="theme-color" content="#FC5200">
<meta name="description" content="Program gym 3 bulan: latihan, makan, progres berat badan, dan pengingat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Latian Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class="wrap">
 <div class="top"><div><h1>Latian Ning Gym</h1><p id="greet">Selamat berlatih</p></div><div class="streak" id="streak" title="Minggu beruntun dengan 4 sesi"></div></div>
 <main id="view"></main>
 <p class="sync" id="sync">Data tersimpan di perangkat ini. Gunakan Ekspor data di halaman Program untuk cadangan.</p>
</div>
<div class="act" id="act"><div class="in">
 <button class="timer" id="timer" aria-label="Pengatur waktu istirahat"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="tarc" cx="18" cy="18" r="15" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg><b id="tval">1:30</b><span id="tlab">Ketuk untuk istirahat</span></button>
 <button class="primary" id="save">Selesai</button>
</div></div>
<nav class="tabs" aria-label="Menu"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>
<!-- Script biasa (bukan module), dimuat berurutan dan berbagi scope global. Urutan penting: app.js terakhir. -->
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/latihan.js"></script>
<script src="js/views/makan.js"></script>
<script src="js/views/progres.js"></script>
<script src="js/views/sesi.js"></script>
<script src="js/views/program.js"></script>
<script src="js/app.js"></script>
</body>
</html>
