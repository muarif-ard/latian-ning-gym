# Menjalankan semua uji di setiap push dan pull request.
name: Uji

on:
  push:
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Unggah tangkapan layar jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tangkapan-layar
          path: tests/output/
